# Research-Agent defaults. Override in ~/.research-agent/config.toml or <project>/.research-agent/project.toml.

[budget]
max_usd_per_session = 10.0      # one Claude Code / Agent SDK session
max_usd_per_project = 100.0     # all sessions + GPU jobs of a project
max_gpu_usd_per_job = 5.0       # one experiment launched through `ra job run`
gpu_usd_per_hour = 1.5          # your GPU rate (cloud price, or amortised local cost)
warn_fraction = 0.8
max_loop_iterations = 3
max_consecutive_fails = 2
max_subagents_per_session = 20
max_parallel_subagents = 3

# USD per million tokens (Claude API first-party rates, 2026-10).
# cache_write = 5-minute cache write (1.25 x input); cache_write_1h = 1-hour cache write (2 x input), which Claude Code uses.
[pricing.opus]
input = 4.0
output = 20.0
cache_write = 5.0
cache_write_1h = 8.0
cache_read = 0.20

[pricing.sonnet]
input = 2.0
output = 10.0
cache_write = 2.5
cache_write_1h = 4.0
cache_read = 0.20

[pricing.haiku]
input = 0.10
output = 0.50
cache_write = 0.125
cache_write_1h = 0.2
cache_read = 0.01

[autonomy]
level = "semi"                  # supervised | semi | autonomous

[data]
protected_paths = []            # raw data: never written (relative to project root)
sensitive_paths = []            # PHI / identifiable data: reading needs approval

[reviewer]
backend = "claude"              # claude | codex

[loop]
default = "none"                # research | coding | full | none

[knowledge]
search_limit = 10
