# Curated metadata for skills that Research-Agent maps to agents.
# Keys are canonical ids "<repo>:<name>". Descriptions are read from each installed SKILL.md;
# builtins (shipped inside Claude Code, no SKILL.md on disk) carry their description here.
#
# task_types vocabulary: literature ideation design implement debug run analyze write figures review plan knowledge
# invoke_as: optional override of the name Claude Code accepts (default "<repo>:<name>", bare name for builtin and
# for supervisor-skills, which are installed user-level into ~/.claude/skills).

