[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.1.0"
description = "Multi-agent research system for Claude Code: orchestrator + 6 specialists, guardrails, provenance, knowledge base."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
sdk = ["claude-agent-sdk"]
dev = ["pytest"]

[project.scripts]
ra = "research_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
